[build]
  publish = "."

# Keep old links to the player working
[[redirects]]
  from = "/player"
  to = "/"
  status = 301

[[redirects]]
  from = "/player.html"
  to = "/"
  status = 301

# Service worker must always be revalidated so updates roll out quickly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

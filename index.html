<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PlayWithTV — Live TV</title>
<meta name="description" content="Watch live Bangla, sports, news, kids and entertainment TV channels in your browser.">
<meta name="theme-color" content="#0a0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="PlayWithTV home">
    <span class="brand-mark" aria-hidden="true"><i></i></span>
    <span class="brand-name">Play<b>With</b>TV</span>
  </a>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" type="search" placeholder="Search channels…" autocomplete="off" aria-label="Search channels">
    <kbd>/</kbd>
  </label>
  <div class="clock mono" id="clock" aria-hidden="true">--:--</div>
</header>

<div class="shell">
  <nav class="sidebar" aria-label="Categories">
    <p class="side-title mono">Browse</p>
    <ul id="cats" class="cats"></ul>
  </nav>

  <main class="main">
    <section class="stage">
      <div class="screen" id="screen">
        <video id="video" playsinline controls preload="none"></video>
        <div class="overlay" id="overlay">
          <div class="spinner" aria-hidden="true"></div>
          <p id="overlayText">Loading channels…</p>
          <div class="overlay-actions" id="overlayActions" hidden>
            <button class="btn" id="retryBtn">Retry</button>
            <button class="btn primary" id="skipBtn">Next channel</button>
          </div>
        </div>
      </div>

      <div class="now">
        <div class="now-logo" id="nowLogo"></div>
        <div class="now-meta">
          <div class="now-tags"><span class="live-pill"><i></i>LIVE</span><span class="mono" id="nowGroup">—</span></div>
          <h1 id="nowName">Select a channel</h1>
        </div>
        <div class="now-actions">
          <button class="icon-btn" id="prevBtn" title="Previous channel (↑)" aria-label="Previous channel"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
          <button class="icon-btn" id="nextBtn" title="Next channel (↓)" aria-label="Next channel"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
          <button class="icon-btn" id="favBtn" title="Add to favorites" aria-label="Toggle favorite" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
          <button class="icon-btn" id="pipBtn" title="Picture-in-picture" aria-label="Picture-in-picture"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" class="fill"/></svg></button>
          <button class="icon-btn" id="shareBtn" title="Copy link to this channel" aria-label="Copy link"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
          <button class="icon-btn" id="fsBtn" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </section>

    <section class="browser" aria-labelledby="gridTitle">
      <div class="browser-head">
        <h2 id="gridTitle">All channels</h2>
        <span class="mono count" id="gridCount"></span>
      </div>
      <div class="chips" id="chips" aria-label="Categories"></div>
      <div class="grid" id="grid" role="list"></div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <footer class="foot mono">
      <span id="updated"></span>
      <span>Shortcuts: <kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> channel · <kbd>F</kbd> fullscreen · <kbd>M</kbd> mute</span>
      <span>Streams are provided by third parties. PlayWithTV does not host any content.</span>
    </footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="/assets/app.js"></script>
</body>
</html>
